name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit formulae
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Normalize GoReleaser-generated formula
        run: |
          set -euo pipefail
          for f in Formula/*.rb; do
            if head -5 "$f" | grep -q 'generated by GoReleaser'; then
              sed -i '/^  version "/d' "$f"
            fi
          done

      - name: Audit formulae (strict, online)
        run: brew audit --strict --online cleanmac github-overview

  style:
    name: Style check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Check formula style and syntax
        run: brew style cleanmac github-overview

  test:
    name: Test ${{ matrix.formula }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        formula: [cleanmac, github-overview]
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Install and test ${{ matrix.formula }}
        run: |
          brew install "${{ matrix.formula }}"
          brew test "${{ matrix.formula }}"
