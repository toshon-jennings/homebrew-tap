name: Normalize GoReleaser-generated formula

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'

permissions:
  contents: write

jobs:
  strip-redundant-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Strip redundant version line
        id: strip
        run: |
          set -euo pipefail
          changed=0
          for f in Formula/*.rb; do
            if head -5 "$f" | grep -q 'generated by GoReleaser'; then
              sed -i.bak '/^  version "/d' "$f"
              rm -f "$f.bak"
              if ! git diff --quiet "$f"; then
                changed=1
              fi
            fi
          done
          if [ "$changed" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push fix
        if: steps.strip.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "chore: drop redundant version from generated formula"
          git push
