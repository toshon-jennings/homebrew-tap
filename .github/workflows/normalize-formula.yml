name: Normalize GoReleaser-generated formula

on:
  push:
    branches: [main]
    paths:
      - 'Formula/**'

permissions:
  contents: write

jobs:
  normalize-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Strip redundant version line
        id: strip
        run: |
          set -euo pipefail
          changed=0
          for f in Formula/*.rb; do
            if head -5 "$f" | grep -q 'generated by GoReleaser'; then
              sed -i.bak '/^  version "/d' "$f"
              rm -f "$f.bak"
              if ! git diff --quiet "$f"; then
                changed=1
              fi
            fi
          done
          if [ "$changed" -eq 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Repair github-overview test and livecheck
        id: repair
        run: |
          set -euo pipefail
          f="Formula/github-overview.rb"
          if [ -f "$f" ] && head -5 "$f" | grep -q 'generated by GoReleaser'; then
            ruby - "$f" <<'RUBY'
          f = ARGV[0]
          s = File.read(f)
          orig = s.dup

          unless s.match?(/strategy\s+:github_latest/)
            s = s.sub(/^  license "MIT"\n/) do |m|
              m + "\n  livecheck do\n    url :stable\n    strategy :github_latest\n  end\n"
            end
          end

          bad_test = /  test do\n    system "\#\{bin\}\/github-overview", "--help"\n  end\n/
          if s.match?(bad_test)
            s = s.gsub(bad_test, "  test do\n    assert_match \"no repos tracked\", shell_output(\"\#{bin}/github-overview list -db \#{testpath}/test.db\")\n  end\n")
          end

          File.write(f, s) unless s == orig
          RUBY
            if ! git diff --quiet "$f"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Commit and push fixes
        if: steps.strip.outputs.changed == 'true' || steps.repair.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "chore: normalize GoReleaser-generated formula"
          git push
